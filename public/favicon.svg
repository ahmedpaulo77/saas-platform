<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>
  <!-- Cube icon -->
  <g transform="translate(6, 5)" fill="white" opacity="0.95">
    <!-- Top face -->
    <polygon points="10,2 18,6 10,10 2,6" fill="white" opacity="1"/>
    <!-- Left face -->
    <polygon points="2,6 2,16 10,20 10,10" fill="white" opacity="0.65"/>
    <!-- Right face -->
    <polygon points="18,6 18,16 10,20 10,10" fill="white" opacity="0.85"/>
  </g>
</svg>
